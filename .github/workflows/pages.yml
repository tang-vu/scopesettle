name: Publish submission proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "deployments/xlayer-testnet-job-2-2026-08-12.json"
      - "deployments/xlayer-testnet-job-3-ai-2026-08-13.json"
      - "deployments/xlayer-mainnet-196-2026-08-13.json"
      - "docs/assets/product-preview.png"
      - "submission-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble immutable public evidence
        run: |
          mkdir -p _site/assets _site/evidence
          cp submission-site/index.html submission-site/styles.css _site/
          cp docs/assets/product-preview.png _site/assets/
          cp deployments/xlayer-testnet-job-2-2026-08-12.json _site/evidence/
          cp deployments/xlayer-testnet-job-3-ai-2026-08-13.json _site/evidence/
          cp deployments/xlayer-mainnet-196-2026-08-13.json _site/evidence/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
