name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scopesettle
          POSTGRES_PASSWORD: scopesettle_ci
          POSTGRES_USER: scopesettle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopesettle -d scopesettle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations and prove they are idempotent
        env:
          DATABASE_URL: postgres://scopesettle:scopesettle_ci@127.0.0.1:5432/scopesettle
        run: |
          pnpm --filter @scopesettle/web db:migrate
          pnpm --filter @scopesettle/web db:migrate

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @scopesettle/shared lint
      - run: pnpm --filter @scopesettle/web lint
      - run: pnpm typecheck
      - run: pnpm --filter @scopesettle/shared test
      - run: pnpm --filter @scopesettle/web test
      - run: pnpm build
      - run: pnpm --filter @scopesettle/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm contracts:test
      - run: pnpm contracts:coverage
