name: Protected contract deployment

on:
  workflow_dispatch:
    inputs:
      network:
        description: Exact target network
        required: true
        type: choice
        options: [xlayer-testnet, xlayer-mainnet]
      confirmation:
        description: Type DEPLOY IMMUTABLE CONTRACTS; a second protected-environment approval follows simulation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scopesettle-contract-deployment-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.confirmation == 'DEPLOY IMMUTABLE CONTRACTS'
    environment: ${{ inputs.network }}-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:test
      - name: Verify chain and show immutable inputs
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          EVALUATOR_SIGNER_ADDRESS: ${{ secrets.EVALUATOR_SIGNER_ADDRESS }}
          MAINNET_RPC: ${{ secrets.XLAYER_MAINNET_RPC_URL }}
          NETWORK: ${{ inputs.network }}
          OKLINK_CHAIN_SHORT_NAME: ${{ secrets.OKLINK_CHAIN_SHORT_NAME }}
          OKLINK_API_KEY: ${{ secrets.OKLINK_API_KEY }}
          PAYMENT_TOKEN_ADDRESS: ${{ secrets.PAYMENT_TOKEN_ADDRESS }}
          REVIEWER_ADDRESS: ${{ secrets.REVIEWER_ADDRESS }}
          TESTNET_RPC: ${{ secrets.XLAYER_TESTNET_RPC_URL }}
        run: |
          if [ "$NETWORK" = "xlayer-testnet" ]; then RPC="$TESTNET_RPC"; EXPECTED=1952; else RPC="$MAINNET_RPC"; EXPECTED=196; fi
          test -n "$DEPLOYER_PRIVATE_KEY"
          test -n "$EVALUATOR_SIGNER_ADDRESS"
          test -n "$OKLINK_API_KEY"
          test -n "$OKLINK_CHAIN_SHORT_NAME"
          test -n "$PAYMENT_TOKEN_ADDRESS"
          test -n "$REVIEWER_ADDRESS"
          test -n "$RPC"
          [[ "$PAYMENT_TOKEN_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
          [[ "$EVALUATOR_SIGNER_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
          [[ "$REVIEWER_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
          [[ "$OKLINK_CHAIN_SHORT_NAME" =~ ^[A-Z0-9_]+$ ]]
          test "$(echo "$EVALUATOR_SIGNER_ADDRESS" | tr '[:upper:]' '[:lower:]')" != "$(echo "$REVIEWER_ADDRESS" | tr '[:upper:]' '[:lower:]')"
          ACTUAL=$(cast chain-id --rpc-url "$RPC")
          test "$ACTUAL" = "$EXPECTED"
          test "$(cast code "$PAYMENT_TOKEN_ADDRESS" --rpc-url "$RPC")" != "0x"
          TOKEN_SYMBOL=$(cast call "$PAYMENT_TOKEN_ADDRESS" 'symbol()(string)' --rpc-url "$RPC")
          TOKEN_DECIMALS=$(cast call "$PAYMENT_TOKEN_ADDRESS" 'decimals()(uint8)' --rpc-url "$RPC")
          DEPLOYER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          BALANCE=$(cast balance "$DEPLOYER" --ether --rpc-url "$RPC")
          GAS_PRICE=$(cast gas-price --rpc-url "$RPC")
          echo "Network: $NETWORK; verified chain ID: $ACTUAL"
          echo "Deployer: $DEPLOYER"
          echo "Deployer balance: $BALANCE OKB"
          echo "RPC gas price: $GAS_PRICE wei"
          echo "Payment token: $PAYMENT_TOKEN_ADDRESS ($TOKEN_SYMBOL; $TOKEN_DECIMALS decimals)"
          echo "Evaluator signer: $EVALUATOR_SIGNER_ADDRESS"
          echo "Reviewer: $REVIEWER_ADDRESS"
          echo "OKLink chain short name: $OKLINK_CHAIN_SHORT_NAME"
          echo "Broadcast command: forge script script/DeployScopeSettle.s.sol --target-contract DeployScopeSettle --rpc-url [redacted] --private-key [secret] --broadcast"
          cd contracts
          forge script script/DeployScopeSettle.s.sol --target-contract DeployScopeSettle --rpc-url "$RPC" --private-key "$DEPLOYER_PRIVATE_KEY"

  deploy:
    needs: preflight
    if: inputs.confirmation == 'DEPLOY IMMUTABLE CONTRACTS'
    environment: ${{ inputs.network }}-broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir contracts deps
      - name: Reverify chain and broadcast after protected approval
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.OKLINK_API_KEY }}
          EVALUATOR_SIGNER_ADDRESS: ${{ secrets.EVALUATOR_SIGNER_ADDRESS }}
          MAINNET_RPC: ${{ secrets.XLAYER_MAINNET_RPC_URL }}
          NETWORK: ${{ inputs.network }}
          OKLINK_CHAIN_SHORT_NAME: ${{ secrets.OKLINK_CHAIN_SHORT_NAME }}
          PAYMENT_TOKEN_ADDRESS: ${{ secrets.PAYMENT_TOKEN_ADDRESS }}
          REVIEWER_ADDRESS: ${{ secrets.REVIEWER_ADDRESS }}
          TESTNET_RPC: ${{ secrets.XLAYER_TESTNET_RPC_URL }}
        run: |
          if [ "$NETWORK" = "xlayer-testnet" ]; then RPC="$TESTNET_RPC"; EXPECTED=1952; else RPC="$MAINNET_RPC"; EXPECTED=196; fi
          ACTUAL=$(cast chain-id --rpc-url "$RPC")
          test "$ACTUAL" = "$EXPECTED"
          DEPLOYER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          echo "Approved deployer: $DEPLOYER"
          echo "Broadcasting on verified chain ID $ACTUAL with payment token $PAYMENT_TOKEN_ADDRESS"
          cd contracts
          forge script script/DeployScopeSettle.s.sol --target-contract DeployScopeSettle --rpc-url "$RPC" --private-key "$DEPLOYER_PRIVATE_KEY" --broadcast
          RUN_FILE="broadcast/DeployScopeSettle.s.sol/$ACTUAL/run-latest.json"
          COMMERCE=$(jq -r '.transactions[] | select(.contractName == "AgenticCommerce") | .contractAddress' "$RUN_FILE")
          EVALUATOR=$(jq -r '.transactions[] | select(.contractName == "ScopeSettleEvaluator") | .contractAddress' "$RUN_FILE")
          COMMERCE_TX=$(jq -r '.transactions[] | select(.contractName == "AgenticCommerce") | .hash' "$RUN_FILE")
          EVALUATOR_TX=$(jq -r '.transactions[] | select(.contractName == "ScopeSettleEvaluator") | .hash' "$RUN_FILE")
          for ADDRESS in "$COMMERCE" "$EVALUATOR"; do
            [[ "$ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
            test "$(cast code "$ADDRESS" --rpc-url "$RPC")" != "0x"
          done
          for TX_HASH in "$COMMERCE_TX" "$EVALUATOR_TX"; do
            [[ "$TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]
          done
          NORMALIZED_TOKEN=$(echo "$PAYMENT_TOKEN_ADDRESS" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_COMMERCE=$(echo "$COMMERCE" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_EVALUATOR=$(echo "$EVALUATOR" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_SIGNER=$(echo "$EVALUATOR_SIGNER_ADDRESS" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_REVIEWER=$(echo "$REVIEWER_ADDRESS" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_DEPLOYER=$(echo "$DEPLOYER" | tr '[:upper:]' '[:lower:]')
          test "$(cast call "$COMMERCE" 'paymentToken()(address)' --rpc-url "$RPC" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_TOKEN"
          test "$(cast call "$EVALUATOR" 'commerce()(address)' --rpc-url "$RPC" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_COMMERCE"
          test "$(cast call "$EVALUATOR" 'verdictSigner()(address)' --rpc-url "$RPC" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_SIGNER"
          test "$(cast call "$EVALUATOR" 'reviewer()(address)' --rpc-url "$RPC" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_REVIEWER"
          if [ "$NETWORK" = "xlayer-testnet" ]; then EXPLORER="https://www.okx.com/web3/explorer/xlayer-test"; else EXPLORER="https://www.okx.com/web3/explorer/xlayer"; fi
          {
            echo "## ScopeSettle $NETWORK deployment"
            echo "- Payment token: [$PAYMENT_TOKEN_ADDRESS]($EXPLORER/address/$PAYMENT_TOKEN_ADDRESS)"
            echo "- AgenticCommerce: [$COMMERCE]($EXPLORER/address/$COMMERCE) · [transaction]($EXPLORER/tx/$COMMERCE_TX)"
            echo "- ScopeSettleEvaluator: [$EVALUATOR]($EXPLORER/address/$EVALUATOR) · [transaction]($EXPLORER/tx/$EVALUATOR_TX)"
          } >> "$GITHUB_STEP_SUMMARY"
          sleep 60
          VERIFY_URL="https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/$OKLINK_CHAIN_SHORT_NAME"
          COMMERCE_ARGS=$(cast abi-encode "constructor(address)" "$PAYMENT_TOKEN_ADDRESS")
          EVALUATOR_ARGS=$(cast abi-encode "constructor(address,address,address)" "$COMMERCE" "$EVALUATOR_SIGNER_ADDRESS" "$REVIEWER_ADDRESS")
          forge verify-contract "$COMMERCE" src/AgenticCommerce.sol:AgenticCommerce --chain "$ACTUAL" --constructor-args "$COMMERCE_ARGS" --verifier oklink --verifier-url "$VERIFY_URL" --watch
          forge verify-contract "$EVALUATOR" src/ScopeSettleEvaluator.sol:ScopeSettleEvaluator --chain "$ACTUAL" --constructor-args "$EVALUATOR_ARGS" --verifier oklink --verifier-url "$VERIFY_URL" --watch
          COMMERCE_BLOCK=$(cast receipt "$COMMERCE_TX" blockNumber --rpc-url "$RPC")
          EVALUATOR_BLOCK=$(cast receipt "$EVALUATOR_TX" blockNumber --rpc-url "$RPC")
          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n --arg chainId "$ACTUAL" --arg commit "$GITHUB_SHA" --arg commerceAddress "$NORMALIZED_COMMERCE" --arg commerceBlock "$COMMERCE_BLOCK" --arg commerceTransactionHash "$(echo "$COMMERCE_TX" | tr '[:upper:]' '[:lower:]')" --arg deployedAt "$DEPLOYED_AT" --arg deployer "$NORMALIZED_DEPLOYER" --arg evaluatorAddress "$NORMALIZED_EVALUATOR" --arg evaluatorBlock "$EVALUATOR_BLOCK" --arg evaluatorTransactionHash "$(echo "$EVALUATOR_TX" | tr '[:upper:]' '[:lower:]')" --arg network "$NETWORK" --arg paymentToken "$NORMALIZED_TOKEN" --arg reviewer "$NORMALIZED_REVIEWER" --arg signer "$NORMALIZED_SIGNER" '{chainId: ($chainId | tonumber), commit: $commit, contracts: {agenticCommerce: {address: $commerceAddress, block: ($commerceBlock | tonumber), transactionHash: $commerceTransactionHash}, scopeSettleEvaluator: {address: $evaluatorAddress, block: ($evaluatorBlock | tonumber), transactionHash: $evaluatorTransactionHash}}, deployedAt: $deployedAt, deployer: $deployer, network: $network, paymentToken: $paymentToken, roles: {evaluatorSigner: $signer, reviewer: $reviewer}, verification: "source-verified"}' > deployment-record.json
          jq -e . deployment-record.json >/dev/null
          cp "$RUN_FILE" broadcast-record.json
          echo "Source verification and RPC immutable checks passed; deployment evidence is attached." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.network }}-deployment-${{ github.sha }}
          path: |
            contracts/deployment-record.json
            contracts/broadcast-record.json
          if-no-files-found: error
          retention-days: 90
