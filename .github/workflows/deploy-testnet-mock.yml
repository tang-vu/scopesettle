name: Protected X Layer Testnet mock deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY VALUELESS TESTNET BETA; a protected approval follows simulation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scopesettle-xlayer-testnet-mock-deployment
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.confirmation == 'DEPLOY VALUELESS TESTNET BETA'
    environment: xlayer-testnet-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:test
      - name: Verify Testnet and simulate immutable deployment
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          EVALUATOR_SIGNER_ADDRESS: ${{ secrets.EVALUATOR_SIGNER_ADDRESS }}
          OKLINK_API_KEY: ${{ secrets.OKLINK_API_KEY }}
          REVIEWER_ADDRESS: ${{ secrets.REVIEWER_ADDRESS }}
          RPC_URL: ${{ secrets.XLAYER_TESTNET_RPC_URL }}
        run: |
          test -n "$DEPLOYER_PRIVATE_KEY"
          test -n "$EVALUATOR_SIGNER_ADDRESS"
          test -n "$OKLINK_API_KEY"
          test -n "$REVIEWER_ADDRESS"
          test -n "$RPC_URL"
          ACTUAL=$(cast chain-id --rpc-url "$RPC_URL")
          test "$ACTUAL" = "1952"
          DEPLOYER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          BALANCE=$(cast balance "$DEPLOYER" --ether --rpc-url "$RPC_URL")
          GAS_PRICE=$(cast gas-price --rpc-url "$RPC_URL")
          echo "Network: X Layer Testnet; verified chain ID: $ACTUAL"
          echo "Deployer: $DEPLOYER"
          echo "Deployer balance: $BALANCE OKB"
          echo "RPC gas price: $GAS_PRICE wei"
          echo "Payment token: new valueless MockUSDG with a public Testnet faucet"
          echo "Evaluator signer: $EVALUATOR_SIGNER_ADDRESS"
          echo "Reviewer: $REVIEWER_ADDRESS"
          echo "Command: forge script script/DeployTestnetMock.s.sol --target-contract DeployTestnetMock --rpc-url [redacted] --private-key [secret]"
          export TESTNET_TOKEN_HOLDER="$DEPLOYER"
          cd contracts
          forge script script/DeployTestnetMock.s.sol --target-contract DeployTestnetMock --rpc-url "$RPC_URL" --private-key "$DEPLOYER_PRIVATE_KEY"

  deploy:
    needs: preflight
    if: inputs.confirmation == 'DEPLOY VALUELESS TESTNET BETA'
    environment: xlayer-testnet-broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir contracts deps
      - name: Reverify chain and broadcast after protected approval
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.OKLINK_API_KEY }}
          EVALUATOR_SIGNER_ADDRESS: ${{ secrets.EVALUATOR_SIGNER_ADDRESS }}
          REVIEWER_ADDRESS: ${{ secrets.REVIEWER_ADDRESS }}
          RPC_URL: ${{ secrets.XLAYER_TESTNET_RPC_URL }}
        run: |
          ACTUAL=$(cast chain-id --rpc-url "$RPC_URL")
          test "$ACTUAL" = "1952"
          DEPLOYER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          echo "Approved deployer: $DEPLOYER"
          echo "Broadcasting valueless beta contracts on verified chain ID $ACTUAL"
          export TESTNET_TOKEN_HOLDER="$DEPLOYER"
          cd contracts
          forge script script/DeployTestnetMock.s.sol --target-contract DeployTestnetMock --rpc-url "$RPC_URL" --private-key "$DEPLOYER_PRIVATE_KEY" --broadcast
          RUN_FILE="broadcast/DeployTestnetMock.s.sol/1952/run-latest.json"
          TOKEN=$(jq -r '.transactions[] | select(.contractName == "MockUSDG") | .contractAddress' "$RUN_FILE")
          COMMERCE=$(jq -r '.transactions[] | select(.contractName == "AgenticCommerce") | .contractAddress' "$RUN_FILE")
          EVALUATOR=$(jq -r '.transactions[] | select(.contractName == "ScopeSettleEvaluator") | .contractAddress' "$RUN_FILE")
          TOKEN_TX=$(jq -r '.transactions[] | select(.contractName == "MockUSDG") | .hash' "$RUN_FILE")
          COMMERCE_TX=$(jq -r '.transactions[] | select(.contractName == "AgenticCommerce") | .hash' "$RUN_FILE")
          EVALUATOR_TX=$(jq -r '.transactions[] | select(.contractName == "ScopeSettleEvaluator") | .hash' "$RUN_FILE")
          for ADDRESS in "$TOKEN" "$COMMERCE" "$EVALUATOR"; do
            [[ "$ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
          done
          for TX_HASH in "$TOKEN_TX" "$COMMERCE_TX" "$EVALUATOR_TX"; do
            [[ "$TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]
          done
          for ADDRESS in "$TOKEN" "$COMMERCE" "$EVALUATOR"; do
            test "$(cast code "$ADDRESS" --rpc-url "$RPC_URL")" != "0x"
          done
          NORMALIZED_TOKEN=$(echo "$TOKEN" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_COMMERCE=$(echo "$COMMERCE" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_EVALUATOR=$(echo "$EVALUATOR" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_SIGNER=$(echo "$EVALUATOR_SIGNER_ADDRESS" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_REVIEWER=$(echo "$REVIEWER_ADDRESS" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_DEPLOYER=$(echo "$DEPLOYER" | tr '[:upper:]' '[:lower:]')
          test "$(cast call "$COMMERCE" 'paymentToken()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_TOKEN"
          test "$(cast call "$EVALUATOR" 'commerce()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_COMMERCE"
          test "$(cast call "$EVALUATOR" 'verdictSigner()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_SIGNER"
          test "$(cast call "$EVALUATOR" 'reviewer()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')" = "$NORMALIZED_REVIEWER"
          test "$(cast call "$TOKEN" 'decimals()(uint8)' --rpc-url "$RPC_URL")" = "6"
          test "$(cast call "$TOKEN" 'symbol()(string)' --rpc-url "$RPC_URL")" = '"mUSDG"'
          EXPLORER="https://www.okx.com/web3/explorer/xlayer-test"
          {
            echo "## X Layer Testnet deployment"
            echo "- MockUSDG: [$TOKEN]($EXPLORER/address/$TOKEN) · [transaction]($EXPLORER/tx/$TOKEN_TX)"
            echo "- AgenticCommerce: [$COMMERCE]($EXPLORER/address/$COMMERCE) · [transaction]($EXPLORER/tx/$COMMERCE_TX)"
            echo "- ScopeSettleEvaluator: [$EVALUATOR]($EXPLORER/address/$EVALUATOR) · [transaction]($EXPLORER/tx/$EVALUATOR_TX)"
          } >> "$GITHUB_STEP_SUMMARY"
          sleep 60
          VERIFY_URL="https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER_TESTNET"
          TOKEN_ARGS=$(cast abi-encode "constructor(address,uint256)" "$DEPLOYER" "1000000000000")
          COMMERCE_ARGS=$(cast abi-encode "constructor(address)" "$TOKEN")
          EVALUATOR_ARGS=$(cast abi-encode "constructor(address,address,address)" "$COMMERCE" "$EVALUATOR_SIGNER_ADDRESS" "$REVIEWER_ADDRESS")
          forge verify-contract "$TOKEN" src/MockUSDG.sol:MockUSDG --chain 1952 --constructor-args "$TOKEN_ARGS" --verifier oklink --verifier-url "$VERIFY_URL" --watch
          forge verify-contract "$COMMERCE" src/AgenticCommerce.sol:AgenticCommerce --chain 1952 --constructor-args "$COMMERCE_ARGS" --verifier oklink --verifier-url "$VERIFY_URL" --watch
          forge verify-contract "$EVALUATOR" src/ScopeSettleEvaluator.sol:ScopeSettleEvaluator --chain 1952 --constructor-args "$EVALUATOR_ARGS" --verifier oklink --verifier-url "$VERIFY_URL" --watch
          echo "Source verification completed for all three contracts." >> "$GITHUB_STEP_SUMMARY"
          TOKEN_BLOCK=$(cast receipt "$TOKEN_TX" blockNumber --rpc-url "$RPC_URL")
          COMMERCE_BLOCK=$(cast receipt "$COMMERCE_TX" blockNumber --rpc-url "$RPC_URL")
          EVALUATOR_BLOCK=$(cast receipt "$EVALUATOR_TX" blockNumber --rpc-url "$RPC_URL")
          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg chainId "1952" \
            --arg commit "$GITHUB_SHA" \
            --arg commerceAddress "$NORMALIZED_COMMERCE" \
            --arg commerceBlock "$COMMERCE_BLOCK" \
            --arg commerceTransactionHash "$(echo "$COMMERCE_TX" | tr '[:upper:]' '[:lower:]')" \
            --arg deployedAt "$DEPLOYED_AT" \
            --arg deployer "$NORMALIZED_DEPLOYER" \
            --arg evaluatorAddress "$NORMALIZED_EVALUATOR" \
            --arg evaluatorBlock "$EVALUATOR_BLOCK" \
            --arg evaluatorTransactionHash "$(echo "$EVALUATOR_TX" | tr '[:upper:]' '[:lower:]')" \
            --arg mockAddress "$NORMALIZED_TOKEN" \
            --arg mockBlock "$TOKEN_BLOCK" \
            --arg mockTransactionHash "$(echo "$TOKEN_TX" | tr '[:upper:]' '[:lower:]')" \
            --arg reviewer "$NORMALIZED_REVIEWER" \
            --arg signer "$NORMALIZED_SIGNER" \
            '{
              chainId: ($chainId | tonumber),
              commit: $commit,
              contracts: {
                agenticCommerce: {
                  address: $commerceAddress,
                  block: ($commerceBlock | tonumber),
                  transactionHash: $commerceTransactionHash
                },
                mockUSDG: {
                  address: $mockAddress,
                  block: ($mockBlock | tonumber),
                  transactionHash: $mockTransactionHash
                },
                scopeSettleEvaluator: {
                  address: $evaluatorAddress,
                  block: ($evaluatorBlock | tonumber),
                  transactionHash: $evaluatorTransactionHash
                }
              },
              deployedAt: $deployedAt,
              deployer: $deployer,
              network: "xlayer-testnet",
              roles: {
                evaluatorSigner: $signer,
                reviewer: $reviewer
              },
              token: {
                decimals: 6,
                kind: "valueless-testnet-mock",
                symbol: "mUSDG"
              },
              verification: "source-verified"
            }' > deployment-record.json
          jq -e . deployment-record.json >/dev/null
          echo "Machine-readable deployment record attached as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: xlayer-testnet-deployment-${{ github.sha }}
          path: |
            contracts/deployment-record.json
            contracts/broadcast/DeployTestnetMock.s.sol/1952/run-latest.json
          if-no-files-found: error
          retention-days: 90
