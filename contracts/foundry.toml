[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 64, fail_on_revert = false }

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
wrap_comments = true

[rpc_endpoints]
local = "http://127.0.0.1:8545"
xlayer_testnet = "${XLAYER_TESTNET_RPC_URL}"
xlayer_mainnet = "${XLAYER_MAINNET_RPC_URL}"
